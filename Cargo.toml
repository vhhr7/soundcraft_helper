[package]
name = "soundcraft-interchange"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
soundcraft-model = { path = "upstream/crates/model" }
soundcraft-time = { path = "upstream/crates/time" }
soundcraft-audio-io = { path = "upstream/crates/audio-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
